# publications.yml lists both publication types and publications
#
# Fields per entry:
#   citation     - markdown; author names, title, venue. **bold** marks Tanvir.
#   year         - used for sorting and for the year rail in the rendered list
#   type         - journal | conference | under-review (groups the entry)
#   venue        - journal | conference | workshop | book | preprint (picks the icon)
#   venue_short  - acronym shown as a tag, for scanning (TCHES, TODAES, ...)
#   link         - canonical URL; rendered as a DOI/link button. Don't also put
#                  the bare "DOI: ..." string in the citation, it duplicates this.
#   badges       - LIST of award strings, e.g. ["Best Paper Award"]

# Types of publication (in order of listing on page)
publication_types:
  - type_id: journal
    pretty: Journal Articles
  - type_id: conference
    pretty: Conference Proceedings
  - type_id: under-review
    pretty: Under Review

