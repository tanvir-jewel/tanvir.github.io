---
layout: default
---

<!-- Page header -->
<div class="jumbotron jumbotron-fluid py-4">
  <div class="container">
    <h1 class="display-4">{{ page.title }}</h1>
    <div class="lead">
      {{ page.jumbo_txt | markdownify }}
    </div>
  </div>
</div>

<!-- Publication page content -->
<div class="container">

  <!-- Short orientation blurb plus an inline legend for the venue icons.
       Only the venue types actually in use are listed. -->
  <div class="row">
    <div class="col">
      <div class="page-intro">
        {{ page.overview | markdownify }}
        <p class="text-muted small mb-0">
          {{ site.data.icons.venue_journal_icon }} Journal article
          <span class="mx-2">·</span>
          {{ site.data.icons.venue_conference_icon }} Conference paper
        </p>
      </div>
    </div>
  </div>

  <!-- This next enumerates all publications listed in publications.yml by category. -->
  <div class="row">
    <div class="col">
      {% include list_publications.html header_level="2" %}
    </div>
  </div>

</div>
